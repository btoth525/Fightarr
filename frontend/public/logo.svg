<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="glv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffba3b"/>
      <stop offset="100%" stop-color="#e08810"/>
    </linearGradient>
    <filter id="octaglow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="centerglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square bg -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Octagon fill (dark inset) -->
  <polygon points="332,58 180,58 58,180 58,332 180,454 332,454 454,332 454,180"
           fill="#1a1a1a"/>

  <!-- Octagon outer glow -->
  <polygon points="334,44 178,44 44,178 44,334 178,468 334,468 468,334 468,178"
           fill="none" stroke="#f5a623" stroke-width="3" opacity="0.22"
           filter="url(#octaglow)"/>

  <!-- Octagon main border -->
  <polygon points="332,58 180,58 58,180 58,332 180,454 332,454 454,332 454,180"
           fill="none" stroke="#f5a623" stroke-width="17" stroke-linejoin="miter"/>

  <!-- Octagon inner accent line -->
  <polygon points="320,76 192,76 76,192 76,320 192,436 320,436 436,320 436,192"
           fill="none" stroke="#f5a623" stroke-width="2" opacity="0.18"/>

  <!-- LEFT GLOVE -->
  <!-- Body extends from lower-left; knuckle face arrives at center (local x=0) -->
  <!-- rotate(-22): wrist lands ~(51,331), knuckles at ~(256,256) -->
  <g transform="translate(256,256) rotate(-22)">
    <!-- Wrist wrap (darker) -->
    <rect x="-218" y="-26" width="48" height="52" rx="11" fill="#9d5e06"/>
    <!-- Wrap stitching lines -->
    <rect x="-212" y="-16" width="36" height="4" rx="2" fill="#7a4804" opacity="0.8"/>
    <rect x="-212" y="-4"  width="36" height="4" rx="2" fill="#7a4804" opacity="0.8"/>
    <rect x="-212" y="8"   width="36" height="4" rx="2" fill="#7a4804" opacity="0.8"/>
    <!-- Main body -->
    <rect x="-218" y="-26" width="190" height="52" rx="14" fill="url(#glv)"/>
    <!-- Body top sheen -->
    <rect x="-206" y="-26" width="170" height="16" rx="8" fill="#ffd47a" opacity="0.25"/>
    <!-- Knuckle block -->
    <rect x="-46" y="-38" width="80" height="76" rx="21" fill="url(#glv)"/>
    <!-- Knuckle highlight ridge (top) -->
    <rect x="-39" y="-38" width="72" height="20" rx="10" fill="#ffe299" opacity="0.38"/>
    <!-- Thumb -->
    <ellipse cx="8" cy="-49" rx="24" ry="14" fill="#f5a623"/>
    <ellipse cx="8" cy="-49" rx="17" ry="9"  fill="#ffd47a" opacity="0.45"/>
    <!-- 4 knuckle ridges -->
    <rect x="-32" y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
    <rect x="-17" y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
    <rect x="-2"  y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
    <rect x="13"  y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
  </g>

  <!-- RIGHT GLOVE (mirror of left) -->
  <!-- rotate(22) scale(-1,1): wrist at ~(461,331), knuckles at ~(256,256) -->
  <g transform="translate(256,256) rotate(22) scale(-1,1)">
    <rect x="-218" y="-26" width="48" height="52" rx="11" fill="#9d5e06"/>
    <rect x="-212" y="-16" width="36" height="4" rx="2" fill="#7a4804" opacity="0.8"/>
    <rect x="-212" y="-4"  width="36" height="4" rx="2" fill="#7a4804" opacity="0.8"/>
    <rect x="-212" y="8"   width="36" height="4" rx="2" fill="#7a4804" opacity="0.8"/>
    <rect x="-218" y="-26" width="190" height="52" rx="14" fill="url(#glv)"/>
    <rect x="-206" y="-26" width="170" height="16" rx="8" fill="#ffd47a" opacity="0.25"/>
    <rect x="-46" y="-38" width="80" height="76" rx="21" fill="url(#glv)"/>
    <rect x="-39" y="-38" width="72" height="20" rx="10" fill="#ffe299" opacity="0.38"/>
    <ellipse cx="8" cy="-49" rx="24" ry="14" fill="#f5a623"/>
    <ellipse cx="8" cy="-49" rx="17" ry="9"  fill="#ffd47a" opacity="0.45"/>
    <rect x="-32" y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
    <rect x="-17" y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
    <rect x="-2"  y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
    <rect x="13"  y="-32" width="5" height="64" rx="2.5" fill="#9d5e06" opacity="0.7"/>
  </g>

  <!-- Impact flash at glove contact point -->
  <circle cx="256" cy="256" r="26" fill="#ffba3b" opacity="0.10" filter="url(#centerglow)"/>
  <circle cx="256" cy="256" r="9"  fill="#ffffff" opacity="0.18"/>
</svg>
