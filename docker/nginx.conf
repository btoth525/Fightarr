server {
    listen 7878;

    root /app/static;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Proxy API, webhooks, and FastAPI built-in docs to uvicorn
    location ~ ^/(api|webhook|docs|redoc|openapi.json)(/|$) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed Vite bundles can be cached forever — the filename changes when
    # the content changes, so a hard cache here is correct.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached — the user's browser needs to see the
    # new bundle hashes the moment a new image is deployed. Without this, the
    # browser keeps loading old JS for hours after a Force Update on Unraid.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
