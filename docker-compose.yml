services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: fightarr-backend
    ports:
      - "7878:7878"
    volumes:
      - ./backend:/app
      - fightarr-data:/data
    environment:
      - FIGHTARR_DB_PATH=/data/fightarr.db
      - FIGHTARR_LOG_LEVEL=INFO
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: fightarr-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:7878
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fightarr-data:
