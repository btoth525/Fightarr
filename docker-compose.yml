# Development compose — hot-reload backend + Vite frontend.
# For production use the root Dockerfile (single-container nginx+uvicorn).
services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: fightarr-backend
    ports:
      - "7878:7878"
    volumes:
      - ./backend:/app
      - fightarr-config:/config
    environment:
      - FIGHTARR_DB_PATH=/config/fightarr.db
      - FIGHTARR_LOG_LEVEL=INFO
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: fightarr-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Inter-container URL — "backend" resolves via Docker's internal DNS.
      # localhost would point to the frontend container itself, not the backend.
      - VITE_API_BASE=http://backend:7878
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fightarr-config:
